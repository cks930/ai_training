<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智造科技｜公司介紹與關係企業</title>
    <!-- 官方網路 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- 外部 CSS 檔案 -->
    <link rel="stylesheet" href="css/about.css">
    
    <!-- 預防頁面載入閃爍的防閃爍指令檔 -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem("theme") || "dark";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark", "dark-mode");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        } else {
          document.documentElement.classList.remove("dark", "dark-mode");
          document.documentElement.setAttribute("data-bs-theme", "light");
        }
      })();
    </script>
</head>
<body>

    <div class="wrapper">
        <!-- Header Logo -->
        <header class="logo d-flex align-items-center justify-content-center py-3">
            <svg width="260" height="50" viewBox="0 0 320 60">
                <rect x="0" y="10" width="20" height="20" rx="4" fill="#3A86FF" />
                <rect x="12" y="22" width="20" height="20" rx="4" fill="#00D084" />
                <text x="45" y="32" font-weight="700" font-size="22" fill="#FFF">智造科技</text>
                <text x="45" y="48" font-weight="600" font-size="9" fill="#3A86FF" letter-spacing="2">CIRCUIT TECH</text>
            </svg>
        </header>

        <!-- 跨頁導覽列（含日夜切換按鈕） -->
        <nav class="site-nav p-2 px-3 d-flex align-items-center justify-content-between overflow-x-auto border-bottom">
            <ul class="nav mx-auto gap-2 m-0 p-0 text-nowrap flex-nowrap align-items-center">
                <li><a href="home.html" class="nav-link">🏠 首頁</a></li>
                <li><span class="nav-link active px-3 py-1 text-primary fw-bold">🏢 關於智造</span></li>
                <li><a href="timeline.html" class="nav-link">📈 發展時間軸</a></li>
                <li><a href="EHC-policy.html" class="nav-link">🛡️ 職業安全</a></li>
                <li><a href="union.html" class="nav-link">🎁 員工福利</a></li>
                <li><a href="R-D.html" class="nav-link">🚀 科技展示</a></li>
                <li><a href="signup.html" class="nav-link">📝 線上報名</a></li>
            </ul>
            <button class="mode-switch flex-shrink-0 ms-2" id="modeButton" aria-label="切換深淺色模式">
                <span>☀/☾</span>
                <span class="switch-track"><span class="switch-dot"></span></span>
            </button>
        </nav>

        <!-- 技術發展區段 -->
        <main class="p-4 p-md-5" id="tech">
            <h1 class="section-title mb-1">公司技術發展</h1>
            <p class="subtitle mb-4 text-muted">TECHNOLOGY DEVELOPMENT</p>
            <div id="techArticles"></div>
        </main>

        <!-- 關係企業區段 -->
        <section class="p-4 p-md-5 border-top border-dashed" id="companies">
            <h1 class="section-title mb-1">關係企業與合作夥伴</h1>
            <p class="subtitle mb-4 text-muted">OUR GROUP & PARTNERS</p>
            <div class="row row-cols-1 row-cols-md-2 g-4" id="companyCards"></div>
        </section>

        <!-- Footer -->
        <footer class="p-3 text-center text-secondary bg-dark border-top border-primary border-3 fs-7">
            智造科技 Circuit Tech © 2026 版權所有
        </footer>
    </div>

    <!-- 外部 JS 檔案 -->
    <script src="js/about.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
