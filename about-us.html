
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>智造科技｜公司介紹與關係企業</title>
    <meta name="description"
          content="了解智造科技的技術發展、PCB 智慧製造與關係企業合作夥伴。">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- 全站共用 CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 公司介紹專用 CSS -->
    <link rel="stylesheet" href="css/about.css">

    <!-- 深淺色初始化 -->
    <script>
        (function () {
            let theme = "dark";

            try {
                theme = localStorage.getItem("theme") === "light"
                    ? "light"
                    : "dark";
            } catch (error) {
                theme = "dark";
            }

            document.documentElement.classList.toggle(
                "dark", theme === "dark"
            );

            document.documentElement.classList.toggle(
                "dark-mode", theme === "dark"
            );

            document.documentElement.setAttribute(
                "data-bs-theme", theme
            );
        })();
    </script>

    <!-- 只修正本頁外框，不影響其他網頁 -->
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            width: 100%;
        }

        body.company-about-page > .wrapper {
            width: 100%;
            max-width: none;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            box-shadow: none;
            outline: none;
            overflow: visible;
        }

        /* 保留內部區塊原本的 Bootstrap 排版 */
        body.company-about-page #navbar-container {
            width: 100%;
        }

        body.company-about-page #tech,
        body.company-about-page #companies {
            width: 100%;
            max-width: none;
        }
    </style>
</head>

<body class="company-about-page">

<div class="wrapper">

    <!-- 全站共用七個導覽按鈕 -->
    <div id="navbar-container"></div>

    <!-- 原本公司 Logo -->
    <header class="logo d-flex align-items-center justify-content-center py-3">
        <svg width="260"
             height="50"
             viewBox="0 0 320 60"
             role="img"
             aria-label="智造科技 Circuit Tech">

            <rect x="0" y="10"
                  width="20" height="20"
                  rx="4" fill="#3A86FF" />

            <rect x="12" y="22"
                  width="20" height="20"
                  rx="4" fill="#00D084" />

            <text x="45" y="32"
                  font-weight="700"
                  font-size="22"
                  fill="#FFF">
                智造科技
            </text>

            <text x="45" y="48"
                  font-weight="600"
                  font-size="9"
                  fill="#7DD3FC"
                  letter-spacing="2">
                CIRCUIT TECH
            </text>
        </svg>
    </header>

    <!-- Section 01：技術發展 -->
    <main class="p-4 p-md-5" id="tech">

        <h1 class="section-title mb-1">
            公司技術發展
        </h1>

        <p class="subtitle mb-4">
            TECHNOLOGY DEVELOPMENT
        </p>

        <!-- 由原本 js/about.js 載入 -->
        <div id="techArticles"></div>

    </main>

    <!-- Section 02：關係企業 -->
    <section class="p-4 p-md-5 border-top border-dashed"
             id="companies">

        <h2 class="section-title mb-1">
            關係企業與合作夥伴
        </h2>

        <p class="subtitle mb-4">
            OUR GROUP & PARTNERS
        </p>

        <!-- 完整保留老師的 Bootstrap 行列 -->
        <div class="row row-cols-1 row-cols-md-2 g-4"
             id="companyCards"></div>

    </section>

    <!-- Footer -->
    <footer class="p-3 text-center border-top border-primary border-3 fs-7">
        智造科技 Circuit Tech © 2026 版權所有
    </footer>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 全站共用導覽列 -->
<script src="js/nav-loader.js"></script>

<!-- 公司介紹原本的動態內容 -->
<script src="js/about.js"></script>

</body>
</html>
