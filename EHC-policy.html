
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="智造科技職業安全衛生管理手冊，介紹雇主安全管理責任與勞工職安義務。">
    <title>智造科技｜職業安全衛生管理守則</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/EHC.css">

    <script>
        (function () {
            let theme = "dark";
            try {
                theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
            } catch (error) {
                theme = "dark";
            }
            document.documentElement.classList.toggle("dark", theme === "dark");
            document.documentElement.classList.toggle("dark-mode", theme === "dark");
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
</head>

<body>
<div class="wrapper">

    <!-- 共用導覽列 -->
    <div id="navbar-container"></div>

    <main class="container my-4">

        <!-- 原本 Banner -->
        <div class="hero-banner text-center p-4 rounded mb-4 shadow-sm">
            <h1 class="display-6 fw-bold mb-2">職業安全衛生管理手冊</h1>
            <p class="lead mb-0 text-muted">
                落實危害預防，推動職業安全訓練與健康維護
            </p>
        </div>

        <!-- 雇主區：保留原本 row -->
        <section class="mb-5" aria-labelledby="employerTitle">
            <h2 class="section-title fs-4 fw-bold mb-3" id="employerTitle">
                雇主應辦理的安全衛生事項
            </h2>
            <div class="row g-4" id="employerList"></div>
        </section>

        <!-- 勞工區：保留原本 row -->
        <section class="mb-5" aria-labelledby="workerTitle">
            <h2 class="section-title fs-4 fw-bold mb-3" id="workerTitle">
                勞工應配合的遵守義務
            </h2>
            <div class="row g-4" id="workerList"></div>
        </section>

    </main>

    <!-- 原本 Footer -->
    <footer>
        <div class="footer-content py-3 text-center">
            <p class="small mb-0 text-muted">
                智造科技 Circuit Tech © 2026 職業安全衛生委員會
            </p>
        </div>
    </footer>

</div>

<!-- 職安知識詳情視窗 -->
<div class="modal fade"
     id="ehcDetailModal"
     tabindex="-1"
     aria-labelledby="ehcDetailTitle"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <span class="detail-category" id="ehcDetailTag"></span>
                    <h2 class="modal-title fs-4 mt-2" id="ehcDetailTitle"></h2>
                </div>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="關閉視窗"></button>
            </div>

            <div class="modal-body">
                <img id="ehcDetailImage"
                     class="detail-image mb-3"
                     alt="職安主題圖片">

                <h3 class="h6 fw-bold detail-subtitle">原始職安說明</h3>
                <p id="ehcDetailDescription"></p>

                <h3 class="h6 fw-bold detail-subtitle mt-4">實務注意事項</h3>
                <ul class="detail-list" id="ehcDetailPoints"></ul>

                <div class="detail-reminder mt-3">
                    <strong>職安提醒</strong>
                    <p class="mb-0 mt-1" id="ehcDetailReminder"></p>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button"
                        class="btn btn-primary"
                        data-bs-dismiss="modal">
                    我已了解
                </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav-loader.js"></script>
<script src="js/EHC.js"></script>
</body>
</html>
