<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智造科技｜職業安全衛生管理守則</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/EHC.css">
    
    <script>
      (function() {
        const savedTheme = localStorage.getItem("theme") || "dark";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      })();
    </script>
</head>
<body>
<div class="wrapper">
    <div id="navbar-container"></div>

    <div class="container my-4">
        <div class="hero-banner text-center p-4 rounded mb-4 shadow-sm">
            <h1 class="display-6 fw-bold mb-2">職業安全衛生管理手冊</h1>
            <p class="lead mb-0 text-muted">落實危害預防，推動職業安全訓練與健康維護</p>
        </div>

        <section class="mb-5">
            <h2 class="section-title fs-4 fw-bold mb-3">雇主應辦理的安全衛生事項</h2>
            <div class="row g-4" id="employerList"></div>
        </section>

        <section class="mb-5">
            <h2 class="section-title fs-4 fw-bold mb-3">勞工應配合的遵守義務</h2>
            <div class="row g-4" id="workerList"></div>
        </section>
    </div>

    <footer>
        <div class="footer-content py-3 text-center">
            <p class="small mb-0 text-muted">智造科技 Circuit Tech © 2026 職業安全衛生委員會</p>
        </div>
    </footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav-loader.js"></script>
<script src="js/EHC.js"></script>
</body>
</html>
