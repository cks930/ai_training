<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智造科技｜員工福利委員會 (EWC)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/union.css">
    
    <script>
      (function() {
        const savedTheme = localStorage.getItem("theme") || "dark";
        if (savedTheme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      })();
    </script>
</head>
<body>
<div class="wrapper">
    <div id="navbar-container"></div>

    <div class="container my-4">
        <div class="main-card p-4 rounded shadow-sm">
            <h1 class="display-6 main-title text-center mb-4 fw-bold fs-3">福委會特約合作廠商列表</h1>
            <div class="table-responsive-md">
                <table class="table custom-table table-rwd mb-0 table-hover align-middle">
                    <thead>
                        <tr>
                            <th style="width: 20%;">餐廳名稱</th>
                            <th style="width: 15%;">圖片</th>
                            <th style="width: 15%;">電話</th>
                            <th style="width: 30%;">住址</th>
                            <th style="width: 20%;">位置導航</th>
                        </tr>
                    </thead>
                    <tbody id="myList">
                        <tr><td colspan="5" class="text-center py-4 text-muted">正在載入美食資料中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content py-3 text-center">
            <p class="small mb-0 text-muted">智造科技 Circuit Tech © 2026 員工福利委員會</p>
        </div>
    </footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav-loader.js"></script>
<script src="js/union.js"></script>
</body>
</html>
